<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     width="1280" height="720"
     font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <!-- 배경 (첫 요소 — 투명 배경은 슬라이드 테마색이 비쳐 글자를 먹음) -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff"/>

  <!-- 타이틀: 액센트 바 + 제목 + 서브 -->
  <rect x="48" y="32" width="6" height="44" rx="3" fill="#4D73BF"/>
  <text x="70" y="56" font-size="27" font-weight="700" fill="#1a1a1a">도식 제목</text>
  <text x="70" y="83" font-size="15" fill="#808890">서브타이틀 · 한 줄 설명</text>

  <!-- 헤더 구분선 (헤더/본문 경계 — 없으면 본문 첫 박스가 헤더처럼 읽힘) -->
  <line x1="48" y1="98" x2="1232" y2="98" stroke="#4D73BF" stroke-width="2"/>

  <!-- 패널 (블루 계열: 밝은 fill + 어두운 stroke + 다크 text) -->
  <rect x="48" y="124" width="360" height="150" rx="12" fill="#E8F0FE" stroke="#4D73BF" stroke-width="2"/>
  <text x="72" y="162" font-size="21" font-weight="700" fill="#1a1a1a">패널 제목</text>
  <text x="72" y="196" font-size="16" fill="#333333">• 개조식 본문 한 줄</text>
  <text x="72" y="224" font-size="16" fill="#333333">• 개조식 본문 두 줄</text>
</svg>
