        <line x1="274" y1="18" x2="302" y2="18" stroke="#A9BFE9" stroke-width="2"/>
        <circle cx="322" cy="18" r="18" fill="#F4D98B"/><text x="322" y="22" text-anchor="middle" class="small" font-weight="800" fill="#775A00">3</text>
