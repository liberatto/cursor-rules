      .label { font-size: 17px; font-weight: 800; letter-spacing: .8px; }
      .tiny { font-size: 9.5px; }
      .small { font-size: 11px; }
      .body { font-size: 13px; }
      .sub { font-size: 15px; }
      .head { font-size: 22px; font-weight: 800; }
      .metric { font-size: 31px; font-weight: 900; }
    </style>
