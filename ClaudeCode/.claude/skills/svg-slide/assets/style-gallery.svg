  <rect width="1920" height="1080" fill="url(#pageBg)"/>
  <circle cx="1780" cy="-40" r="250" fill="#D9E6FF" opacity=".42"/>
  <circle cx="60" cy="1060" r="210" fill="#E7DDFE" opacity=".38"/>

  <text x="96" y="76" font-size="38" font-weight="900" fill="#14213D">INFOGRAPHIC STYLE GALLERY</text>
  <text x="97" y="112" font-size="18" fill="#667085">각 프레임은 독립적인 16:9 슬라이드입니다 · 같은 메시지, 다른 정보 구조</text>
  <g transform="translate(1645 55)">
