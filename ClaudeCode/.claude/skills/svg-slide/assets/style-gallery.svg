        <line x1="122" y1="18" x2="150" y2="18" stroke="#A9BFE9" stroke-width="2"/>
        <circle cx="170" cy="18" r="18" fill="#DCE8FF"/><text x="170" y="22" text-anchor="middle" class="small" font-weight="800" fill="#2857B2">2</text>
