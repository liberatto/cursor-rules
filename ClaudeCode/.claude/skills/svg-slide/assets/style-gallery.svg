    <g transform="translate(16 330)"><circle cx="8" cy="8" r="8" fill="#3769C8"/><text x="25" y="13" class="label" fill="#23314D">01 Executive Grid</text><text x="205" y="13" class="body" fill="#7A8495">임원보고 · 의사결정</text></g>
